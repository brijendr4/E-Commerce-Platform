services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ecommerce-backend

    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}

    expose:
      - "5000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecommerce-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped